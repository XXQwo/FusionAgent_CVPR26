# PIPA FusionAgent adaptation.
# PIPA is image-based and has no gait/video modality.
root: "/path/to/pipa_data_root"
dataset: "pipa"
pipa_protocol: "0to1"  # gallery=test0, query=test1; rerun with 1to0 and average
num_sample: 1
max_samples: 2000
few_shot: null
num_workers: 4
prefetch_factor: 2

model: "Qwen/Qwen2.5-VL-3B-Instruct"
train_method: "grpo"
model_cache_dir: "./src/fusionagent/checkpoints"
output_dir: "./src/fusionagent/checkpoints"
max_pixels: 401408
max_prompt_length: 8888
max_completion_length: 256
max_turns: 3
num_train_epochs: 8
max_steps: 200
per_device_train_batch_size: 1
num_generations: 6
gradient_accumulation_steps: 1
per_device_eval_batch_size: 1
gradient_checkpointing: false
mixed_precision: false
bf16: true
deepspeed: src/fusionagent/configs/zero2.json
save_steps: 50
eval_steps: 50
eval_delay: 100
seed: 42
reward_funcs: [format_v2, metric, tool_success_rate, answer_accuracy]
reward_weights: null
top_k: 40
main_frac: 0.6

use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

learning_rate: 2.0e-5
beta: 0.04
weight_decay: 0.0
warmup_ratio: 0.0
lr_scheduler_type: "linear"

use_wandb: true
wandb_project: "fusionagent"
wandb_run_name: "pipa-head-upper-grpo"
logging_steps: 1
